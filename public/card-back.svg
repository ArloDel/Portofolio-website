<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1125" width="800" height="1125">
  <defs>
    <linearGradient id="backBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <rect width="800" height="1125" rx="36" fill="url(#backBg)" />
  <rect x="2" y="2" width="796" height="1121" rx="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />

  <!-- Magnetic stripe / chip band -->
  <rect x="0" y="80" width="800" height="90" fill="#0A0A0C" />
  <line x1="0" y1="80" x2="800" y2="80" stroke="#FFFFFF" stroke-opacity="0.08" />
  <line x1="0" y1="170" x2="800" y2="170" stroke="#FFFFFF" stroke-opacity="0.08" />

  <!-- Notice block -->
  <g transform="translate(60, 220)">
    <text x="0" y="20" font-family="monospace, sans-serif" font-size="12" fill="#71717A" letter-spacing="3">TERMS OF CREDENTIAL</text>
    
    <text x="0" y="60" font-family="system-ui, sans-serif" font-size="16" fill="#A1A1AA" width="680">
      This credential confirms verified technical sovereignty in frontend mastery,
    </text>
    <text x="0" y="88" font-family="system-ui, sans-serif" font-size="16" fill="#A1A1AA">
      resilient backend architecture, and high-performance UI engineering.
    </text>
    <text x="0" y="116" font-family="system-ui, sans-serif" font-size="16" fill="#A1A1AA">
      Direct inquiries: alifnurrahmanhakim@gmail.com
    </text>

    <!-- Stylized QR Code Box -->
    <g transform="translate(230, 180)">
      <rect width="220" height="220" rx="16" fill="#18181B" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />
      
      <!-- QR Position Corner 1 -->
      <rect x="24" y="24" width="46" height="46" rx="6" fill="#FAFAFA" />
      <rect x="32" y="32" width="30" height="30" rx="3" fill="#18181B" />
      <rect x="38" y="38" width="18" height="18" rx="2" fill="#38BDF8" />

      <!-- QR Position Corner 2 -->
      <rect x="150" y="24" width="46" height="46" rx="6" fill="#FAFAFA" />
      <rect x="158" y="32" width="30" height="30" rx="3" fill="#18181B" />
      <rect x="164" y="38" width="18" height="18" rx="2" fill="#38BDF8" />

      <!-- QR Position Corner 3 -->
      <rect x="24" y="150" width="46" height="46" rx="6" fill="#FAFAFA" />
      <rect x="32" y="158" width="30" height="30" rx="3" fill="#18181B" />
      <rect x="38" y="164" width="18" height="18" rx="2" fill="#38BDF8" />

      <!-- QR Data Pixels -->
      <g fill="#A1A1AA">
        <rect x="85" y="25" width="12" height="12" rx="2" />
        <rect x="105" y="25" width="12" height="12" rx="2" />
        <rect x="125" y="35" width="12" height="12" rx="2" />
        <rect x="85" y="55" width="12" height="12" rx="2" />
        <rect x="110" y="65" width="12" height="12" rx="2" />
        <rect x="25" y="85" width="12" height="12" rx="2" />
        <rect x="45" y="95" width="12" height="12" rx="2" />
        <rect x="85" y="85" width="14" height="14" rx="2" fill="#38BDF8" />
        <rect x="105" y="95" width="12" height="12" rx="2" />
        <rect x="135" y="85" width="12" height="12" rx="2" />
        <rect x="165" y="85" width="12" height="12" rx="2" />
        <rect x="180" y="105" width="12" height="12" rx="2" />
        <rect x="85" y="125" width="12" height="12" rx="2" />
        <rect x="105" y="135" width="12" height="12" rx="2" />
        <rect x="130" y="120" width="12" height="12" rx="2" />
        <rect x="160" y="135" width="12" height="12" rx="2" />
        <rect x="85" y="160" width="12" height="12" rx="2" />
        <rect x="110" y="170" width="12" height="12" rx="2" />
        <rect x="140" y="165" width="12" height="12" rx="2" />
        <rect x="175" y="160" width="12" height="12" rx="2" />
      </g>
    </g>

    <text x="340" y="440" font-family="monospace, sans-serif" font-size="13" fill="#71717A" text-anchor="middle" letter-spacing="3">SCAN TO CONNECT // @ARLODEL</text>
  </g>

  <!-- Signature Line -->
  <g transform="translate(60, 750)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" />
    <text x="0" y="30" font-family="monospace, sans-serif" font-size="11" fill="#71717A" letter-spacing="2">ISSUED TO</text>
    <text x="0" y="60" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="700" fill="#FAFAFA">Alif Nur Rahman Hakim</text>
    
    <text x="680" y="30" font-family="monospace, sans-serif" font-size="11" fill="#71717A" text-anchor="end" letter-spacing="2">AUTHENTICITY</text>
    <text x="680" y="60" font-family="monospace, sans-serif" font-size="18" font-weight="600" fill="#10B981" text-anchor="end">LEVEL 10 // ROOT</text>
  </g>

  <!-- Bottom Stamp -->
  <g transform="translate(400, 960)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="6 4" />
    <text x="0" y="6" font-family="monospace, sans-serif" font-size="14" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="2">EUCHRONIA</text>
  </g>
</svg>
