<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgAtelier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgAtelier)" />

  <!-- Mockup Window Frame -->
  <g transform="translate(60, 45)">
    <!-- Browser Header Bar -->
    <rect width="680" height="42" rx="10" fill="#121215" stroke="#FFFFFF" stroke-opacity="0.08" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="42" cy="21" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="60" cy="21" r="5" fill="#10B981" opacity="0.8" />

    <!-- URL pill -->
    <rect x="180" y="9" width="320" height="24" rx="12" fill="#1F1F24" />
    <text x="340" y="25" font-family="monospace, sans-serif" font-size="11" fill="#71717A" text-anchor="middle">atelier-senja.vercel.app</text>

    <!-- Canvas Inner Body -->
    <rect y="42" width="680" height="318" fill="#0C0A09" stroke="#FFFFFF" stroke-opacity="0.08" />

    <!-- Editorial Layout Inside Window -->
    <g transform="translate(45, 80)">
      <text x="0" y="20" font-family="monospace, sans-serif" font-size="12" fill="#D97706" letter-spacing="3">BESPOKE ARTISAN ATELIER</text>
      
      <text x="0" y="70" font-family="'Times New Roman', serif" font-size="44" font-weight="700" fill="#F5F5F4" letter-spacing="-1">
        Crafting Modern
      </text>
      <text x="0" y="120" font-family="'Times New Roman', serif" font-size="44" font-style="italic" fill="url(#goldAccent)">
        Digital Artifacts.
      </text>

      <line x1="0" y1="155" x2="220" y2="155" stroke="#D97706" stroke-width="2" opacity="0.6" />

      <text x="0" y="185" font-family="sans-serif" font-size="13" fill="#A8A29E">
        Next.js • TypeScript • Tailwind CSS • Vercel Edge
      </text>

      <!-- Decorative Mock Card -->
      <g transform="translate(380, 0)">
        <rect width="210" height="190" rx="12" fill="#1C1917" stroke="#292524" />
        <rect x="20" y="20" width="170" height="100" rx="6" fill="#292524" />
        <text x="105" y="75" font-family="sans-serif" font-size="28" fill="#78716C" text-anchor="middle">❖</text>
        <rect x="20" y="135" width="100" height="8" rx="4" fill="#57534E" />
        <rect x="20" y="152" width="140" height="8" rx="4" fill="#44403C" />
      </g>
    </g>
  </g>
</svg>
