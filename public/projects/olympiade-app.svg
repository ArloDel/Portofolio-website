<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgOlympiade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgOlympiade)" />

  <!-- Mockup Window Frame -->
  <g transform="translate(60, 45)">
    <!-- Browser Header Bar -->
    <rect width="680" height="42" rx="10" fill="#0B132B" stroke="#FFFFFF" stroke-opacity="0.08" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="42" cy="21" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="60" cy="21" r="5" fill="#10B981" opacity="0.8" />

    <!-- URL pill -->
    <rect x="180" y="9" width="320" height="24" rx="12" fill="#172554" />
    <text x="340" y="25" font-family="monospace, sans-serif" font-size="11" fill="#60A5FA" text-anchor="middle">olympiade-app-kappa.vercel.app</text>

    <!-- Canvas Inner Body -->
    <rect y="42" width="680" height="318" fill="#020617" stroke="#FFFFFF" stroke-opacity="0.08" />

    <!-- Dashboard Layout Inside Window -->
    <g transform="translate(45, 75)">
      <text x="0" y="20" font-family="monospace, sans-serif" font-size="12" fill="#38BDF8" letter-spacing="3">ACADEMIC COMPETITION PLATFORM</text>
      
      <text x="0" y="65" font-family="sans-serif" font-size="38" font-weight="700" fill="#F8FAFC" letter-spacing="-1">
        Live Tournament Scoring
      </text>
      <text x="0" y="105" font-family="sans-serif" font-size="28" font-weight="600" fill="url(#blueAccent)">
        &amp; Real-time Examination Engine
      </text>

      <text x="0" y="150" font-family="sans-serif" font-size="13" fill="#94A3B8">
        TypeScript • Next.js 14 • React • Tailwind CSS
      </text>

      <!-- Mock Stats Row -->
      <g transform="translate(0, 175)">
        <rect width="180" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
        <text x="20" y="25" font-family="sans-serif" font-size="10" fill="#64748B">ACTIVE CONTESTANTS</text>
        <text x="20" y="48" font-family="monospace, sans-serif" font-size="18" font-weight="700" fill="#38BDF8">1,240+</text>

        <rect x="200" width="180" height="60" rx="8" fill="#0F172A" stroke="#1E293B" />
        <text x="220" y="25" font-family="sans-serif" font-size="10" fill="#64748B">EXAM ROUNDS</text>
        <text x="220" y="48" font-family="monospace, sans-serif" font-size="18" font-weight="700" fill="#10B981">100% LIVE</text>
      </g>
    </g>
  </g>
</svg>
